name: Build dated ETF holdings snapshot
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve real holdings; fail when any fund is missing or invalid
        run: python scripts/build_snapshot.py --output data/portfolio_xray_holdings.json
      - name: Publish one canonical snapshot to this repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/portfolio_xray_holdings.json
          if ! git diff --cached --quiet; then
            git commit -m "Update real ETF holdings snapshot"
            git push
          else
            echo "No change in data"
          fi
